name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor project
        run: |
          SRC=$(dirname "$(find . -name index.html -not -path './node_modules/*' -not -path './www/*' | head -1)")
          echo "Game folder: $SRC"
          mkdir -p www
          for item in index.html css js data assets; do
            [ -e "$SRC/$item" ] && cp -r "$SRC/$item" www/
          done
          cat > package.json << 'EOF'
          {
            "name": "after-zero",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.afterzero.game",
            "appName": "AFTER ZERO",
            "webDir": "www",
            "backgroundColor": "#0b0d12"
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AFTER-ZERO-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
